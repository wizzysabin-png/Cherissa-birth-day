<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday • draw the bow, hit the heart</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #fcf8f6;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 800px;
      max-height: 900px;
    }
    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    .text-overlay {
      position: absolute;
      top: 15%;
      width: 100%;
      text-align: center;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    .subtitle {
      font-style: italic;
      color: #9e8e88;
      font-size: 1.1rem;
      margin-bottom: 8px;
    }
    .title {
      font-size: 3.5rem;
      font-weight: 900;
      color: #e63956;
      line-height: 1;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(20px);
      transition: all 1.2s ease;
    }
    .title.show {
      opacity: 1;
      transform: translateY(0);
    }
    .footer-text {
      margin-top: 12px;
      font-style: italic;
      color: #9e8e88;
      font-size: 0.95rem;
      opacity: 0;
      transition: opacity 1.5s ease 0.8s;
    }
    .footer-text.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div id="stage">
    <div class="text-overlay">
      <div id="subText" class="subtitle">a real recurve bow + a cupid's arrow</div>
      <h1 id="mainTitle" class="title">Happy<br>Birthday</h1>
      <div id="footerText" class="footer-text">to someone worth celebrating</div>
    </div>
    <canvas id="canvas"></canvas>
  </div>

  <script src="birthday.js"></script>
</body>
</html>
